<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>template</title>

    <!-- Modern CSS framework -->
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css" />

    <!-- Optional custom tweaks -->
    <style>
      body {
        max-width: 800px;
        margin: 2rem auto;
      }
      img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 1rem auto;
      }
      figure {
        text-align: center;
      }
      figcaption {
        font-style: italic;
        color: #666;
      }
    </style>
  </head>
  
  <body>
    <main class="container">
      <header>
        <h1>template</h1>
      </header>

      <section>
        <div class="container" role="main">
        <h1 id="title">$title$</h1>
        <section>
        $body$
        </section>
        <hr />
        <p><span class="small">Generated with Pandoc on
        $date$</span></p>
        </div>
      </section>

      <footer>
        <hr />
        <p><small>Generated with Pandoc on </small></p>
      </footer>
    </main>
  </body>
</html>
